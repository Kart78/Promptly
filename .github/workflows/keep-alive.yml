name: Keep Supabase Alive
on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert Supabase heartbeat
        run: |
          response=$(curl -s -o response.txt -w "%{http_code}" \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"source":"github_actions","status":"alive"}')
          echo "Insert Response: $response"
          if [ "$response" != "201" ]; then
            echo "❌ Insert failed"
            cat response.txt
            exit 1
          fi

      - name: Delete heartbeat older than 3 days
        run: |
          response=$(curl -s -o response.txt -w "%{http_code}" \
            -X DELETE \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?created_at=lt.$(date -u -d '3 days ago' '+%Y-%m-%dT%H:%M:%SZ')" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Delete Response: $response"
          if [ "$response" = "204" ]; then
            echo "✅ Old heartbeat records deleted"
          else
            echo "⚠️ Delete response: $response"
            cat response.txt
          fi
